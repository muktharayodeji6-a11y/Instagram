<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable.png">
<title>Instagram</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
  #app{position:fixed;inset:0;margin:0 auto;max-width:430px;background:#0c1014;overflow:hidden;user-select:none;-webkit-user-select:none}
  .page{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;
        overscroll-behavior:none;scrollbar-width:none;touch-action:pan-y;contain:layout paint;
        opacity:1;transform:scale(1);transition:opacity .28s ease,transform .28s ease;will-change:opacity,transform}
  .page::-webkit-scrollbar{display:none}
  .page.off{opacity:0;transform:scale(.985);visibility:hidden;pointer-events:none;
            transition:opacity .28s ease,transform .28s ease,visibility 0s linear .28s}
  #feed{background:#000}
  #profile{background:#0c1014}
  .page img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
  .pad{width:100%}
  .rel{position:relative}
  #hot{position:absolute;left:0;top:47.72%;width:33.1%;height:22.58%;touch-action:pan-y}

  #nav{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#0c1014;
       padding-bottom:env(safe-area-inset-bottom,0px);transform:translateZ(0);backface-visibility:hidden}
  #nav .imgs{position:relative}
  #nav img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;transition:opacity .25s ease}
  #nav img.hide{position:absolute;inset:0;opacity:0}
  #zones{position:absolute;inset:0;display:flex}
  #zones div{flex:1}

  /* ---- long-press popup ---- */
  #pop{position:absolute;inset:0;z-index:30;visibility:hidden;opacity:0;touch-action:none;
       transition:opacity .22s ease,visibility 0s linear .22s}
  #pop.on{visibility:visible;opacity:1;transition:opacity .22s ease}
  #popBd{position:absolute;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  #popGrp{position:absolute;opacity:0;transform:scale(.4);will-change:transform,opacity;
          transition:transform .34s cubic-bezier(.2,.9,.25,1.04),opacity .2s ease}
  #pop.on #popGrp{opacity:1;transform:scale(1)}
  #popGrp img{position:absolute;left:0;display:block;pointer-events:none;-webkit-user-drag:none}
  #popCard{top:0;width:100%;height:66.04%}
  #popMenu{top:67.15%;width:64.72%;height:32.85%}
  #popItems{position:absolute;left:0;top:67.15%;width:64.72%;height:32.85%;display:flex;flex-direction:column}
  #popItems div{flex:1}
  /* video sits exactly on the card's media area (y 88..945 of 1431 units) */
  #vbox{position:absolute;left:0;top:6.15%;width:100%;height:59.89%;overflow:hidden;background:#000;
        border-radius:0 0 calc(var(--s,1px)*28) calc(var(--s,1px)*28);pointer-events:none}
  #vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .aud{position:absolute;left:3.8%;width:82.4%;top:93.7%;height:5%;display:flex;align-items:center;
       color:#fff;font:500 calc(var(--s,1px)*24)/1 system-ui,-apple-system,Roboto,sans-serif;
       text-shadow:0 0 calc(var(--s,1px)*6) rgba(0,0,0,.55)}
  .aud svg{flex:none;width:calc(var(--s,1px)*26);height:calc(var(--s,1px)*26);margin-right:calc(var(--s,1px)*10);fill:#fff;
       filter:drop-shadow(0 0 calc(var(--s,1px)*4) rgba(0,0,0,.5))}
  .mq{overflow:hidden;white-space:nowrap;flex:1;
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}
  .mq span{display:inline-block;padding-right:calc(var(--s,1px)*60);animation:mq 9s linear infinite}
  @keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  .mute{position:absolute;left:calc(93.2% - var(--s,1px)*21);top:calc(94.8% - var(--s,1px)*21);
        width:calc(var(--s,1px)*42);height:calc(var(--s,1px)*42);border-radius:50%;
        background:rgba(40,42,46,.78);display:flex;align-items:center;justify-content:center}
  .mute svg{width:56%;height:56%;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  #boot{position:absolute;inset:0;background:#1a1a1a;z-index:50;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .logo{width:22%;height:auto;display:block}
  #boot .from{position:absolute;left:0;right:0;bottom:calc(8.6% + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:1.3vh}
  #boot .from span{font:400 min(3.9vw,17px)/1 system-ui,-apple-system,Roboto,sans-serif;color:#6f7f8f}
  #boot .from svg{width:min(18vw,78px);height:auto;display:block}
</style>
</head>
<body>
<div id="app">
  <div id="feed" class="page"></div>
  <div id="profile" class="page off"></div>
  <div id="nav">
    <div class="imgs">
      <img id="navH" alt="">
      <img id="navP" class="hide" alt="">
      <div id="zones"><div data-t="home"></div><div></div><div></div><div></div><div data-t="profile"></div></div>
    </div>
  </div>
  <div id="pop">
    <div id="popBd"></div>
    <div id="popGrp">
      <img id="popCard" alt=""><img id="popMenu" alt="">
      <div id="vbox">
        <video id="vid" muted loop playsinline webkit-playsinline preload="none" disablepictureinpicture></video>
        <div class="aud">
          <svg viewBox="0 0 24 24"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8.2l8-1.6v6.7A3.5 3.5 0 1 0 21 16.5V3.2L9 3z"/></svg>
          <div class="mq"><span>musi.cdailydose · Original audio (may include audio from Runawa…</span></div>
        </div>
        <div class="mute"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="#fff" stroke="none"/><path d="M16 9l5 6M21 9l-5 6"/></svg></div>
      </div>
      <div id="popItems"><div></div><div></div><div></div><div></div><div></div></div>
    </div>
  </div>
  <div id="boot">
    <svg class="logo" viewBox="0 0 100 100" fill="none">
      <defs><linearGradient id="ig" gradientUnits="userSpaceOnUse" x1="55" y1="102" x2="32" y2="2">
        <stop offset="0" stop-color="#ffd800"/><stop offset=".14" stop-color="#ffa400"/><stop offset=".3" stop-color="#ff4a2a"/><stop offset=".46" stop-color="#ff0868"/><stop offset=".66" stop-color="#ff00c8"/><stop offset=".92" stop-color="#9a0cff"/><stop offset="1" stop-color="#8a05ff"/></linearGradient></defs>
      <g stroke="url(#ig)" stroke-width="7.6"><rect x="3.8" y="3.8" width="92.4" height="92.4" rx="27"/><circle cx="50" cy="50" r="22.5"/></g>
      <circle cx="73.5" cy="26.5" r="5.6" fill="url(#ig)"/>
    </svg>
    <div class="from"><span>from</span>
      <svg viewBox="0 0 132 44">
        <defs><linearGradient id="mg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="132" y2="0">
          <stop offset="0" stop-color="#ff7a00"/><stop offset=".3" stop-color="#ff3a30"/><stop offset=".46" stop-color="#ff0a5a"/><stop offset="1" stop-color="#f800c8"/></linearGradient></defs>
        <path d="M46.0 20.0 L45.9 22.3 L45.5 24.5 L44.9 26.5 L44.1 28.2 L43.1 29.5 L41.8 30.5 L40.3 30.9 L38.7 30.9 L36.9 30.5 L35.0 29.5 L32.9 28.2 L30.8 26.5 L28.6 24.5 L26.3 22.3 L24.0 20.0 L21.7 17.7 L19.4 15.5 L17.2 13.5 L15.1 11.8 L13.0 10.5 L11.1 9.5 L9.3 9.1 L7.7 9.1 L6.2 9.5 L4.9 10.5 L3.9 11.8 L3.1 13.5 L2.5 15.5 L2.1 17.7 L2.0 20.0 L2.1 22.3 L2.5 24.5 L3.1 26.5 L3.9 28.2 L4.9 29.5 L6.2 30.5 L7.7 30.9 L9.3 30.9 L11.1 30.5 L13.0 29.5 L15.1 28.2 L17.2 26.5 L19.4 24.5 L21.7 22.3 L24.0 20.0 L26.3 17.7 L28.6 15.5 L30.8 13.5 L32.9 11.8 L35.0 10.5 L36.9 9.5 L38.7 9.1 L40.3 9.1 L41.8 9.5 L43.1 10.5 L44.1 11.8 L44.9 13.5 L45.5 15.5 L45.9 17.7 L46.0 20.0Z" transform="translate(2 2)" fill="none" stroke="url(#mg)" stroke-width="6.2" stroke-linejoin="round"/>
        <text x="56" y="34" font-family="system-ui,-apple-system,Roboto,sans-serif" font-size="37" font-weight="500" textLength="74" lengthAdjust="spacingAndGlyphs" fill="url(#mg)">Meta</text>
      </svg></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const feed=$('feed'),prof=$('profile'),nav=$('nav'),pop=$('pop'),grp=$('popGrp'),vid=$('vid');

const A={feed1:'feed1.webp',feed2:'feed2.webp',profile:'profile.webp',navH:'navH.webp',navP:'navP.webp',
  popCard:'popCard.webp',popMenu:'popMenu.webp',poster:'poster.jpg',video:'vid.mp4'};
function load(key){
  const im=new Image();im.decoding='async';im.src=A[key];
  return (im.decode?im.decode():new Promise(r=>{im.onload=r;im.onerror=r})).catch(()=>{}).then(()=>{
    im.width=im.naturalWidth;im.height=im.naturalHeight;return im;
  });
}
function pad(page){
  let p=page.querySelector('.pad');
  if(!p){p=document.createElement('div');p.className='pad';page.appendChild(p)}
  p.style.height=nav.offsetHeight+'px';
}

const T0=performance.now();
let vidURL=null,vidLoading=null;   // video bytes are pulled into memory once, then reused
async function init(){
  const [f1,f2,pr,nh,np,pc,pm]=await Promise.all(
    ['feed1','feed2','profile','navH','navP','popCard','popMenu'].map(load));
  $('popCard').src=pc.src;$('popMenu').src=pm.src;
  vid.poster=A.poster;
  feed.append(f1,f2);
  const wrap=document.createElement('div');wrap.className='rel';
  const hot=document.createElement('div');hot.id='hot';
  wrap.append(pr,hot);prof.append(wrap);
  setupLongPress(hot);
  $('navH').replaceWith(nh);nh.id='navH';
  $('navP').replaceWith(np);np.id='navP';np.className='hide';
  pad(feed);pad(prof);
  addEventListener('resize',()=>{pad(feed);pad(prof);if(pop.classList.contains('on'))layoutPop()});
  const wait=Math.max(0,1100-(performance.now()-T0));
  setTimeout(()=>requestAnimationFrame(()=>$('boot').classList.add('gone')),wait);
  setTimeout(getVideoURL,900);
}

/* ---------- long-press popup ---------- */
let popOpenAt=0,closeTimer=null,lastHot=null;
function layoutPop(hot){
  hot=hot||lastHot;lastHot=hot;
  const app=$('app'),aw=app.clientWidth,ah=app.clientHeight;
  const s=Math.min(aw*0.906/652,ah*0.965/1431);
  const gw=652*s,gh=1431*s,left=(aw-gw)/2,top=Math.max(ah*0.015,(ah-gh)*0.4);
  grp.style.setProperty('--s',s+'px');
  grp.style.width=gw+'px';grp.style.height=gh+'px';grp.style.left=left+'px';grp.style.top=top+'px';
  if(hot){
    const r=hot.getBoundingClientRect(),a=app.getBoundingClientRect();
    grp.style.transformOrigin=(r.left+r.width/2-a.left-left)+'px '+(r.top+r.height/2-a.top-top)+'px';
  }
}
function getVideoURL(){
  if(vidURL)return Promise.resolve(vidURL);
  if(!vidLoading)vidLoading=fetch(A.video).then(r=>r.blob()).then(b=>(vidURL=URL.createObjectURL(b)))
    .catch(()=>(vidURL=A.video));
  return vidLoading;
}
async function playVideo(){
  const u=await getVideoURL();
  if(!pop.classList.contains('on'))return;
  if(!vid.getAttribute('src'))vid.src=u;
  try{vid.currentTime=0}catch(e){}
  const p=vid.play();if(p&&p.catch)p.catch(()=>{});
}
function openPop(hot){
  clearTimeout(closeTimer);
  layoutPop(hot);
  void grp.offsetWidth;
  pop.classList.add('on');popOpenAt=Date.now();
  playVideo();
  if(navigator.vibrate)navigator.vibrate(14);
}
function closePop(){
  if(Date.now()-popOpenAt<350)return;
  pop.classList.remove('on');
  clearTimeout(closeTimer);
  closeTimer=setTimeout(()=>{ vid.pause();vid.removeAttribute('src');vid.load(); },320); // free the decoder
}
function setupLongPress(hot){
  let timer=null,sx=0,sy=0;
  const clear=()=>{clearTimeout(timer);timer=null};
  hot.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;clear();timer=setTimeout(()=>{timer=null;openPop(hot)},420)});
  hot.addEventListener('pointermove',e=>{if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)clear()});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>hot.addEventListener(ev,clear));
}
$('popBd').addEventListener('click',closePop);
$('popItems').addEventListener('click',closePop);
grp.addEventListener('click',e=>{if(e.target===grp)closePop()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)vid.pause();else if(pop.classList.contains('on'))vid.play().catch(()=>{})});

/* ---------- tabs ---------- */
let tab='home';
function show(t){
  if(t==='home'){
    if(tab==='home'){feed.scrollTo({top:0,behavior:'smooth'});return}
    feed.classList.remove('off');prof.classList.add('off');
    $('navH').classList.remove('hide');$('navP').classList.add('hide');
  }else{
    if(tab==='profile'){prof.scrollTo({top:0,behavior:'smooth'});return}
    prof.classList.remove('off');feed.classList.add('off');
    $('navP').classList.remove('hide');$('navH').classList.add('hide');
  }
  tab=t;
}
$('zones').addEventListener('click',e=>{const t=e.target.dataset.t;if(t)show(t)});
document.addEventListener('contextmenu',e=>e.preventDefault());

init();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
